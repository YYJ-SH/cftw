<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SecureCorp API Interface</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        .glass {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
        
        .cyber-gradient {
            background: linear-gradient(45deg, #0a2463, #3e92cc);
        }
        
        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }
        
        .pulse {
            animation: pulse 2s cubic-bezier(0.4, 0, 0.6, 1) infinite;
        }
    </style>
</head>
<body class="bg-black min-h-screen">
    <div class="cyber-gradient fixed inset-0 opacity-50"></div>
    
    <div class="relative z-10 container mx-auto px-4 py-8">
        <!-- Header -->
        <div class="glass rounded-2xl p-6 mb-8">
            <h1 class="text-3xl text-cyan-400 font-bold mb-2">(주)융보공 API Interface</h1>
            <div class="flex items-center space-x-2">
                <div class="w-2 h-2 bg-green-400 rounded-full pulse"></div>
                <p class="text-gray-400">시스템 상태: Online</p>
            </div>
        </div>

        <!-- Chat Interface -->
        <div class="glass rounded-2xl p-6 mb-8">
            <div id="chat-container" class="h-96 overflow-y-auto mb-4 space-y-4 text-gray-200">
                <div class="bg-blue-500/20 p-4 rounded-lg">
                    (주)융보공 시스템 인터페이스에 접속하신 걸 환영합니다. 무엇을 도와드릴까요?
                </div>
            </div>
            
            <div class="flex space-x-4">
                <input 
                    type="text" 
                    id="userInput"
                    class="flex-1 bg-black/50 border border-cyan-500/30 rounded-lg px-4 py-2 text-white focus:outline-none focus:ring-2 focus:ring-cyan-500"
                    placeholder="Enter your message..."
                >
                <button 
                    onclick="sendMessage()"
                    class="bg-cyan-500 hover:bg-cyan-600 text-white px-6 py-2 rounded-lg transition-colors duration-200"
                >
                    Send
                </button>
            </div>
        </div>

        <!-- API Status -->
        <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
            <div class="glass rounded-xl p-4">
                <div class="flex justify-between items-center">
                    <h3 class="text-cyan-400">user_api</h3>
                    <div class="w-2 h-2 bg-green-400 rounded-full"></div>
                </div>
                <p class="text-gray-400 text-sm mt-2">User Information Query</p>
            </div>
            <div class="glass rounded-xl p-4">
                <div class="flex justify-between items-center">
                    <h3 class="text-cyan-400">admin_api</h3>
                    <div class="w-2 h-2 bg-red-400 rounded-full"></div>
                </div>
                <p class="text-gray-400 text-sm mt-2">Admin Functions</p>
            </div>
            <div class="glass rounded-xl p-4">
                <div class="flex justify-between items-center">
                    <h3 class="text-cyan-400">db_api</h3>
                    <div class="w-2 h-2 bg-yellow-400 rounded-full"></div>
                </div>
                <p class="text-gray-400 text-sm mt-2">Database Operations</p>
            </div>
        </div>
    </div>

    <script>
        const chatContainer = document.getElementById('chat-container');
        const userInput = document.getElementById('userInput');

        function addMessage(message, isUser) {
            const div = document.createElement('div');
            div.className = isUser 
                ? 'bg-cyan-500/20 p-4 rounded-lg ml-12' 
                : 'bg-blue-500/20 p-4 rounded-lg mr-12';
            div.textContent = message;
            chatContainer.appendChild(div);
            chatContainer.scrollTop = chatContainer.scrollHeight;
        }

        async function sendMessage() {
            const message = userInput.value.trim();
            if (!message) return;

            addMessage(message, true);
            userInput.value = '';

            try {
                const response = await fetch('/chat', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({message})
                });

                const data = await response.json();
                if (data.status === 'success') {
                    addMessage(data.message, false);
                }
            } catch (error) {
                addMessage('Error: Connection failed', false);
            }
        }

        userInput.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') sendMessage();
        });
    </script>
</body>
</html>
