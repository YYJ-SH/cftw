<!-- templates/index.html -->
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CTF Challenge - Regex Lock</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 min-h-screen flex items-center justify-center">
    <div class="max-w-md w-full mx-auto p-6">
        <div class="bg-white rounded-lg shadow-xl p-8">
            <div class="text-center mb-8">
                <h1 class="text-2xl font-bold text-gray-800 mb-2">정규식 로그인 챌린지</h1>
                <p class="text-gray-600">로그인에 성공해서 플래그를 획득하세요</p>
            </div>
            
            <!-- Lock Animation -->
            <div id="lock-container" class="flex justify-center mb-8">
                <div class="w-32 h-32 relative">
                   
                    <div id="locked-state" class="absolute inset-0">
                        <svg class="w-full h-full text-gray-700" viewBox="0 0 24 24" fill="currentColor">
                            <path d="M12 1a5 5 0 0 0-5 5v3H6a2 2 0 0 0-2 2v10a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V11a2 2 0 0 0-2-2h-1V6a5 5 0 0 0-5-5zm0 2a3 3 0 0 1 3 3v3H9V6a3 3 0 0 1 3-3z"/>
                        </svg>
                    </div>
                    
                    <div id="unlocked-state" class="absolute inset-0 hidden">
                        <svg class="w-full h-full text-green-500" viewBox="0 0 24 24" fill="currentColor">
                            <path d="M12 1a5 5 0 0 0-5 5v3H6a2 2 0 0 0-2 2v10a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V11a2 2 0 0 0-2-2h-1V6a3 3 0 0 0-6 0v3H9V6a3 3 0 0 1 3-3z"/>
                        </svg>
                    </div>
                </div>
            </div>
            
           
            <form id="login-form" class="space-y-6">
                <div>
                    <label for="username" class="block text-sm font-medium text-gray-700">Username</label>
                    <input type="text" id="username" name="username" required
                        class="mt-1 block w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm focus:outline-none focus:ring-indigo-500 focus:border-indigo-500">
                </div>
                
                <div>
                    <label for="password" class="block text-sm font-medium text-gray-700">Password</label>
                    <input type="text" id="password" name="password" required
                        class="mt-1 block w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm focus:outline-none focus:ring-indigo-500 focus:border-indigo-500">
                </div>
                
                <button type="submit" 
                    class="w-full flex justify-center py-2 px-4 border border-transparent rounded-md shadow-sm text-sm font-medium text-white bg-indigo-600 hover:bg-indigo-700 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-indigo-500">
                    Unlock
                </button>
            </form>
            
           
            <div id="message" class="mt-4 text-center hidden">
                <p id="message-text" class="text-sm"></p>
            </div>
            
            
            <div id="flag-container" class="mt-6 text-center hidden">
                <p class="text-lg font-mono bg-gray-100 p-3 rounded-lg"></p>
            </div>
        </div>
        <div id="debug-info" class="mt-6 p-4 bg-gray-100 rounded-lg hidden">
            <h3 class="text-sm font-semibold text-gray-700 mb-2">Debug Information:</h3>
            <div class="space-y-2 text-xs font-mono">
                <div>
                    <div class="font-semibold">Original Input:</div>
                    <div id="original-input" class="pl-4"></div>
                </div>
                <div>
                    <div class="font-semibold">Filtered Result:</div>
                    <div id="filtered-result" class="pl-4"></div>
                </div>
                <div>
                    <div class="font-semibold">RegEx Patterns:</div>
                    <div id="regex-patterns" class="pl-4"></div>
                </div>
            </div>
        </div>

        <script>
            document.getElementById('login-form').addEventListener('submit', async (e) => {
                e.preventDefault();
                
                const formData = new FormData(e.target);
                
                try {
                    const response = await fetch('/login', {
                        method: 'POST',
                        body: formData
                    });
                    
                    const data = await response.json();
                    
                    // Show message
                    const messageEl = document.getElementById('message');
                    const messageText = document.getElementById('message-text');
                    messageEl.classList.remove('hidden');
                    messageText.textContent = data.message;
                    messageText.className = data.success ? 'text-green-600' : 'text-red-600';
                    
                    // Update lock state
                    document.getElementById('locked-state').classList.toggle('hidden', data.success);
                    document.getElementById('unlocked-state').classList.toggle('hidden', !data.success);
                    
                    // Show flag if successful
                    const flagContainer = document.getElementById('flag-container');
                    if (data.success) {
                        flagContainer.classList.remove('hidden');
                        flagContainer.querySelector('p').textContent = data.flag;
                    } else {
                        flagContainer.classList.add('hidden');
                    }

                    // Show debug info
                    const debugInfo = document.getElementById('debug-info');
                    debugInfo.classList.remove('hidden');
                    
                    // Update debug information
                    document.getElementById('original-input').innerHTML = `
                        Username: ${data.debug.original_input.username}<br>
                        Password: ${data.debug.original_input.password}
                    `;
                    
                    document.getElementById('filtered-result').innerHTML = `
                        Username: ${data.debug.filtered_result.username}<br>
                        Password: ${data.debug.filtered_result.password}
                    `;
                    
                    document.getElementById('regex-patterns').innerHTML = `
                        Password Check: ${data.debug.regex_patterns.password_check}<br>
                        Password Transform: ${data.debug.regex_patterns.password_transform}<br>
                        Username Filter: ${data.debug.regex_patterns.username_filter}
                    `;
                    
                } catch (error) {
                    console.error('Error:', error);
                }
            });
        </script>
    </div>
</div>
</body>
</html>
