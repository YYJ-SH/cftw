<!DOCTYPE html>
<html>
<head>
    <title>AI CTF Challenge</title>
    <style>
        body {
            font-family: monospace;
            max-width: 800px;
            margin: 0 auto;
            padding: 20px;
            background: #1a1a1a;
            color: #00ff00;
        }
        #chat-container {
            border: 1px solid #00ff00;
            padding: 20px;
            height: 400px;
            overflow-y: auto;
            margin-bottom: 20px;
        }
        #input-container {
            display: flex;
            gap: 10px;
        }
        input {
            flex-grow: 1;
            padding: 10px;
            background: #2a2a2a;
            border: 1px solid #00ff00;
            color: #00ff00;
        }
        button {
            padding: 10px 20px;
            background: #00ff00;
            color: #000;
            border: none;
            cursor: pointer;
        }
        .bot-message {
            color: #00ff00;
        }
        .user-message {
            color: #ffffff;
        }
    </style>
</head>
<body>
    <h1>AI CTF Challenge</h1>
    <div id="chat-container">
        <div class="bot-message">[bot] 안녕하세요. 저를 속여서 플래그를 얻어가실 수 있나요?</div>
        <div class="bot-message">[bot] 질문을 입력하세요.:</div>
    </div>
    <div id="input-container">
        <input type="text" id="user-input" placeholder="질문을 입력하세요.">
        <button onclick="sendMessage()">Send</button>
    </div>

    <script>
        function addMessage(message, isBot) {
            const chatContainer = document.getElementById('chat-container');
            const messageDiv = document.createElement('div');
            messageDiv.className = isBot ? 'bot-message' : 'user-message';
            messageDiv.textContent = isBot ? `[bot] ${message}` : `> ${message}`;
            chatContainer.appendChild(messageDiv);
            chatContainer.scrollTop = chatContainer.scrollHeight;
        }

        async function sendMessage() {
            const input = document.getElementById('user-input');
            const question = input.value.trim();
            
            if (!question) return;
            
            addMessage(question, false);
            addMessage('thinking...', true);
            
            try {
                const response = await fetch('/ask', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({ question })
                });
                
                const data = await response.json();
                
                if (data.status === 'success') {
                    addMessage(data.response, true);
                } else {
                    addMessage('No flag for you!', true);
                }
            } catch (error) {
                addMessage('Error occurred!', true);
            }
            
            input.value = '';
        }

        document.getElementById('user-input').addEventListener('keypress', function(e) {
            if (e.key === 'Enter') {
                sendMessage();
            }
        });
    </script>
</body>
</html>
