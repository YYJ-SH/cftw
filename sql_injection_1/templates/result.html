<!DOCTYPE html>
<html>
<head>
    <title>Result</title>
    <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
</head>
<body class="bg-gray-100">
    <div class="max-w-md mx-auto mt-10 p-6 bg-white shadow-md rounded-lg">
        <h2 class="text-xl font-bold mb-4 text-center">Result</h2>
        <p class="text-center text-lg text-blue-600">{{ message }}</p>
        
        {% if result %}
        <h3 class="mt-4 text-lg font-semibold">User Information:</h3>
        <pre class="bg-gray-200 p-4 rounded-md">{{ result }}</pre>
        {% endif %}
        
        <a href="/" class="block text-center text-blue-500 mt-4">Back to Login</a>
    </div>
</body>
</html>
