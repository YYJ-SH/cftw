<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>융보공 - 성신여대 보안 전문 동아리</title>
    <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
</head>
<body class="min-h-screen" style="background: linear-gradient(to bottom right, #0f172a, #1e3a8a);">
    <nav class="bg-gray-900 border-b border-slate-700">
        <div class="max-w-6xl mx-auto px-4">
            <div class="flex justify-between items-center py-4">
                <div class="flex items-center space-x-2">
                    <svg class="h-10 w-10" viewBox="0 0 40 40" xmlns="http://www.w3.org/2000/svg">
                        <circle cx="20" cy="20" r="18" fill="#1e3a8a" stroke="#ffffff" stroke-width="2"/>
                        <path d="M20 10 L26 15 L26 25 L14 25 L14 15 Z" fill="none" stroke="#ffffff" stroke-width="2"/>
                        <circle cx="20" cy="20" r="2" fill="#ffffff"/>
                    </svg>
                    <span class="font-bold text-xl text-white">融保工</span>
                </div>
                <div class="flex items-center space-x-4">
                    <a href="#" class="text-gray-300 hover:text-white">About</a>
                    <a href="#" class="text-gray-300 hover:text-white">Contact</a>
                </div>
            </div>
        </div>
    </nav>

    <div class="max-w-6xl mx-auto mt-10 flex items-center justify-between px-4">
        <div class="w-1/2 pr-10">
            <h1 class="text-4xl font-bold text-white mb-6">화락하고 오래 성하는<br>지키는 장인들</h1>
            <p class="text-lg text-gray-300 mb-8">성신여대 보안 전문 동아리 융보공에서<br>차세대 보안 전문가의 꿈을 이루세요.</p>
            <div class="space-y-4 text-gray-300">
                <div class="flex items-center space-x-3">
                    <i class="fas fa-shield-alt text-blue-400"></i>
                    <span>침투 테스팅 도구 실습</span>
                </div>
                <div class="flex items-center space-x-3">
                    <i class="fas fa-laptop-code text-blue-400"></i>
                    <span>모의해킹 프로젝트</span>
                </div>
                <div class="flex items-center space-x-3">
                    <i class="fas fa-network-wired text-blue-400"></i>
                    <span>네트워크 보안 분석</span>
                </div>
            </div>
        </div>

        <div class="w-1/2 max-w-md">
            <div class="bg-slate-800 p-8 shadow-2xl rounded-lg border border-slate-700">
                <h2 class="text-2xl font-bold mb-6 text-center text-white">Member Login</h2>
                <form action="/login" method="post" class="space-y-6">
                    <div>
                        <label for="uid" class="block text-sm font-medium text-gray-300 mb-1">아이디</label>
                        <div class="relative">
                            <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
                                <i class="fas fa-user text-slate-500"></i>
                            </div>
                            <input type="text" id="uid" name="uid" 
                                class="w-full pl-10 pr-4 py-2 bg-slate-700 border border-slate-600 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500 text-blue"
                                placeholder="아이디를 입력하세요">
                        </div>
                    </div>
                    <div>
                        <label for="pwd" class="block text-sm font-medium text-gray-300 mb-1">비밀번호</label>
                        <div class="relative">
                            <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
                                <i class="fas fa-lock text-slate-500"></i>
                            </div>
                            <input type="password" id="pwd" name="pwd" 
                                class="w-full pl-10 pr-4 py-2 bg-slate-700 border border-slate-600 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500 text-blue-300"
                                placeholder="비밀번호를 입력하세요">
                        </div>
                    </div>
                    <div class="flex items-center justify-between">
                        <div class="flex items-center">
                            <input type="checkbox" id="remember" class="h-4 w-4 bg-slate-700 border-slate-600 rounded text-blue-500">
                            <label for="remember" class="ml-2 block text-sm text-gray-300">로그인 상태 유지</label>
                        </div>
                        <a href="#" class="text-sm text-blue-400 hover:text-blue-300">비밀번호 찾기</a>
                    </div>
                    <button type="submit" 
                        class="w-full bg-blue-600 text-white py-2 px-4 rounded-lg hover:bg-blue-700 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:ring-offset-2 transition-colors duration-200">
                        로그인
                    </button>
                </form>
                <div class="mt-6 text-center">
                    <p class="text-sm text-gray-400">신입 부원 모집 중! 
                        <a href="#" class="text-blue-400 hover:text-blue-300">지원하기</a>
                    </p>
                </div>
            </div>
        </div>
    </div>

    <div class="fixed bottom-0 w-full bg-slate-800 border-t border-slate-700">
        <div class="max-w-6xl mx-auto px-4 py-4">
            <div class="flex justify-between items-center text-sm text-gray-400">
                <div>© 2024 融保工(융보공). All rights reserved.</div>
                <div class="flex space-x-4">
                    <a href="#" class="hover:text-gray-300">개인정보처리방침</a>
                    <a href="#" class="hover:text-gray-300">이용약관</a>
                    <a href="#" class="hover:text-gray-300">동아리 소개</a>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
